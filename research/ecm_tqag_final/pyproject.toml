[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecm-tqag"
version = "1.0.0"
description = "Publication instrument for answer-first multimodal question construction"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
