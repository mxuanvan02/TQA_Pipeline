# Pytest configuration
#
# Chi thu muc tests/ chua test pytest that su.
# research/work_ecm24/test_*.py la script kiem tra tu chay (co sys.exit o
# top level, khong co ham test_*), nen pytest collect se bao INTERNALERROR.
# Chay chung bang: python research/work_ecm24/test_<ten>.py
[pytest]
testpaths = tests
norecursedirs = research .git .venv venv data _backups state submission_hujos .pi-subagents
python_files = test_*.py
addopts = -q
